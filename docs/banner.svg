<text x="72" y="98" class="eyebrow">FLYRANK AI INTERNSHIP · BE-01 · BE-02 · A3</text>
<text x="66" y="200" class="h1">Task API</text>
<text x="72" y="262" class="sub">A hand-built CRUD REST API in Python &amp;</text>
<text x="72" y="298" class="sub">FastAPI, now on PostgreSQL in Docker.</text>
<text x="72" y="334" class="sub">One command starts the stack, and the</text>
<text x="72" y="370" class="sub">data survives a restart.</text>
<rect x="72" y="404" width="55" height="36" rx="8" fill="#2F80ED"/><text x="99.5" y="428" text-anchor="middle" class="chip" fill="#fff">GET</text><rect x="137" y="404" width="66" height="36" rx="8" fill="#1FA971"/><text x="170.0" y="428" text-anchor="middle" class="chip" fill="#fff">POST</text><rect x="213" y="404" width="55" height="36" rx="8" fill="#E59A1A"/><text x="240.5" y="428" text-anchor="middle" class="chip" fill="#fff">PUT</text><rect x="278" y="404" width="88" height="36" rx="8" fill="#E5484D"/><text x="322.0" y="428" text-anchor="middle" class="chip" fill="#fff">DELETE</text><rect x="377" y="404" width="108" height="36" rx="8" fill="none" stroke="#6FDCA4" stroke-width="2"/><text x="431.0" y="428" text-anchor="middle" class="chip" fill="#6FDCA4">Postgres</text><rect x="497" y="404" width="86" height="36" rx="8" fill="none" stroke="#6FDCA4" stroke-width="2"/><text x="540.0" y="428" text-anchor="middle" class="chip" fill="#6FDCA4">Docker</text>
