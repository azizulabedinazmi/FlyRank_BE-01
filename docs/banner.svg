<text x="500" y="563" fill="#6E7F84" style="font-family:Consolas,Menlo,monospace;font-size:13px">FR-D1-A84A9-AB526</text>

<!-- terminal -->
<rect x="706" y="64" width="504" height="324" rx="16" fill="#020E0F" fill-opacity=".78" stroke="#6FDCA4" stroke-opacity=".22"/>
<circle cx="732" cy="90" r="6" fill="#2B4A44"/><circle cx="752" cy="90" r="6" fill="#2B4A44"/><circle cx="772" cy="90" r="6" fill="#2B4A44"/>
<text x="1188" y="95" text-anchor="end" class="mono mut" font-size="13">task-api</text>
<text x="730" y="150" class="mono t0"><tspan class="prompt">$ </tspan><tspan class="cmd">docker compose up</tspan></text><text x="730" y="181" class="mono t1"><tspan class="ok">✓ </tspan><tspan class="p">db     </tspan><tspan class="ok">postgres:17 (healthy)</tspan></text><text x="730" y="212" class="mono t2"><tspan class="ok">✓ </tspan><tspan class="p">redis  </tspan><tspan class="ok">redis:7 (healthy)</tspan></text><text x="730" y="243" class="mono t3"><tspan class="ok">✓ </tspan><tspan class="p">api    </tspan><tspan class="mut">→ localhost:8000</tspan></text><text x="730" y="274" class="mono t4"><tspan class="m">POST </tspan><tspan class="p">/tasks </tspan><tspan class="mut">"Survive the restart" </tspan><tspan class="ok">→ 201</tspan></text><text x="730" y="305" class="mono t5"><tspan class="prompt">$ </tspan><tspan class="cmd">docker compose down</tspan><tspan class="mut">   # containers gone</tspan></text><text x="730" y="336" class="mono t6"><tspan class="prompt">$ </tspan><tspan class="cmd">docker compose up</tspan></text><text x="730" y="367" class="mono t7"><tspan class="m">GET </tspan><tspan class="p">/tasks/5 </tspan><tspan class="ok">→ 200  still there ✓</tspan></text>
