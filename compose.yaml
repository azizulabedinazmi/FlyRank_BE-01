# docker compose up   -> starts the database and the API together.
# ${...} values come from .env (docker compose reads it automatically). No secret is written in this file.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      # Inside the compose network the database is reachable by its service name "db", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # A17: the model. Inside a container "localhost" is the container itself, so Ollama on your machine is
      # host.docker.internal. For OpenRouter set LLM_DOCKER_BASE_URL to https://openrouter.ai/api/v1 in .env.
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      LLM_STUB: ${LLM_STUB:-0}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-30}
      LLM_DEADLINE_S: ${LLM_DEADLINE_S:-60}
    extra_hosts: ["host.docker.internal:host-gateway"]  # makes host.docker.internal work on Linux too
    volumes:
      - ./logs:/app/logs  # the LLM cost log and quarantine survive the container
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres accepts connections, not just until it starts
      redis:
        condition: service_healthy

  db:
    # Pinned to 17: the postgres:18+ images keep data under /var/lib/postgresql instead of .../data.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]  # so psql/DBeaver/a local uvicorn can reach it too
    volumes:
      - taskdata:/var/lib/postgresql/data  # the rows live here, outside the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Stretch: Redis for W4 (jobs, caching). The api pings it on startup and in /health.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  taskdata:
